    <style>
       * {
  box-sizing: border-box;
}

.container {
  display: grid;
  grid-template-columns: repeat(8, 80px);
  grid-template-rows: repeat(8, 80px);
  gap: 0;
  padding: 0;
  border: 4px solid #333;

  background: conic-gradient(
    #769656 25%,
    #eeeed2 0 50%,
    #769656 0 75%,
    #eeeed2 0
  ) 0 0 / 160px 160px;
}

.box {
  /* Keep the squares transparent so the pattern shows through. */
}
